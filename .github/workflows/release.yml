name: Build & Release

on:
  push:
    branches:
      - master

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and push tag
        id: bump
        run: |
          LATEST=$(git tag --sort=-v:refname | grep '^v' | head -1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v1.0.0"
            LOG=$(git log --pretty="- %s" | head -30)
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            LOG=$(git log --pretty="- %s" "${LATEST}..HEAD")
          fi
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          {
            echo "## 변경사항"
            echo ""
            echo "$LOG"
          } > changelog.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.txt

  build-macos-arm:
    needs: bump-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        working-directory: src
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate icon.icns from icon.png
        run: |
          mkdir -p src/assets/icon.iconset
          sips -z 16 16     src/assets/icon.png --out src/assets/icon.iconset/icon_16x16.png
          sips -z 32 32     src/assets/icon.png --out src/assets/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/assets/icon.png --out src/assets/icon.iconset/icon_32x32.png
          sips -z 64 64     src/assets/icon.png --out src/assets/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/assets/icon.png --out src/assets/icon.iconset/icon_128x128.png
          sips -z 256 256   src/assets/icon.png --out src/assets/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/assets/icon.png --out src/assets/icon.iconset/icon_256x256.png
          sips -z 512 512   src/assets/icon.png --out src/assets/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/assets/icon.png --out src/assets/icon.iconset/icon_512x512.png
          sips -z 1024 1024 src/assets/icon.png --out src/assets/icon.iconset/icon_512x512@2x.png
          iconutil -c icns src/assets/icon.iconset -o src/assets/icon.icns

      - name: Build .app
        working-directory: src
        run: |
          python -m PyInstaller build.spec \
            --distpath ../ \
            --workpath build_tmp \
            --noconfirm

      - name: Ad-hoc sign .app
        run: |
          APP="인플루언서시딩기.app"
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) \
            -exec codesign --force --sign - {} \; 2>/dev/null || true
          find "$APP" -name "*.framework" -type d | sort -r | \
            xargs -I {} codesign --force --sign - {} 2>/dev/null || true
          codesign --force --sign - "$APP"

      - name: Create DMG
        run: |
          mkdir dmg_staging
          cp -R "인플루언서시딩기.app" dmg_staging/
          cat > "dmg_staging/처음_여기서_실행하세요.command" << 'SCRIPT'
#!/bin/bash
DIR="$(cd "$(dirname "$0")" && pwd)"
xattr -cr "$DIR/인플루언서시딩기.app" 2>/dev/null
open "$DIR/인플루언서시딩기.app"
SCRIPT
          chmod +x "dmg_staging/처음_여기서_실행하세요.command"
          hdiutil create \
            -volname "InfluencerSeeder" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-mac-arm.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-dmg
          path: "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-mac-arm.dmg"

  build-macos-intel:
    needs: bump-version
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        working-directory: src
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate icon.icns from icon.png
        run: |
          mkdir -p src/assets/icon.iconset
          sips -z 16 16     src/assets/icon.png --out src/assets/icon.iconset/icon_16x16.png
          sips -z 32 32     src/assets/icon.png --out src/assets/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     src/assets/icon.png --out src/assets/icon.iconset/icon_32x32.png
          sips -z 64 64     src/assets/icon.png --out src/assets/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   src/assets/icon.png --out src/assets/icon.iconset/icon_128x128.png
          sips -z 256 256   src/assets/icon.png --out src/assets/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   src/assets/icon.png --out src/assets/icon.iconset/icon_256x256.png
          sips -z 512 512   src/assets/icon.png --out src/assets/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   src/assets/icon.png --out src/assets/icon.iconset/icon_512x512.png
          sips -z 1024 1024 src/assets/icon.png --out src/assets/icon.iconset/icon_512x512@2x.png
          iconutil -c icns src/assets/icon.iconset -o src/assets/icon.icns

      - name: Build .app
        working-directory: src
        run: |
          python -m PyInstaller build.spec \
            --distpath ../ \
            --workpath build_tmp \
            --noconfirm

      - name: Ad-hoc sign .app
        run: |
          APP="인플루언서시딩기.app"
          find "$APP" -type f \( -name "*.dylib" -o -name "*.so" \) \
            -exec codesign --force --sign - {} \; 2>/dev/null || true
          find "$APP" -name "*.framework" -type d | sort -r | \
            xargs -I {} codesign --force --sign - {} 2>/dev/null || true
          codesign --force --sign - "$APP"

      - name: Create DMG
        run: |
          mkdir dmg_staging
          cp -R "인플루언서시딩기.app" dmg_staging/
          cat > "dmg_staging/처음_여기서_실행하세요.command" << 'SCRIPT'
#!/bin/bash
DIR="$(cd "$(dirname "$0")" && pwd)"
xattr -cr "$DIR/인플루언서시딩기.app" 2>/dev/null
open "$DIR/인플루언서시딩기.app"
SCRIPT
          chmod +x "dmg_staging/처음_여기서_실행하세요.command"
          hdiutil create \
            -volname "InfluencerSeeder" \
            -srcfolder dmg_staging \
            -ov -format UDZO \
            "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-mac-intel.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel-dmg
          path: "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-mac-intel.dmg"

  build-windows:
    needs: bump-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        working-directory: src
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .exe folder
        working-directory: src
        run: |
          python -m PyInstaller build.spec `
            --distpath ../ `
            --workpath build_tmp `
            --noconfirm

      - name: Zip output
        run: |
          Compress-Archive -Path "인플루언서시딩기" `
            -DestinationPath "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-windows.zip"

  release:
    needs: [bump-version, build-macos-arm, build-macos-intel, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: changelog

      - uses: actions/download-artifact@v4
        with:
          name: macos-arm-dmg

      - uses: actions/download-artifact@v4
        with:
          name: macos-intel-dmg

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag }}
          body_path: changelog.txt
          files: |
            InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-mac-arm.dmg
            InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-mac-intel.dmg
            InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-windows.zip
