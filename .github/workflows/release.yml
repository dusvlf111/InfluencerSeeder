name: Build & Release

on:
  push:
    branches:
      - master

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and push tag
        id: bump
        run: |
          LATEST=$(git tag --sort=-v:refname | grep '^v' | head -1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

  build-macos:
    needs: bump-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        working-directory: src
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .app
        working-directory: src
        run: |
          python -m PyInstaller build.spec \
            --distpath ../ \
            --workpath build_tmp \
            --noconfirm

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "InfluencerSeeder" \
            -srcfolder "인플루언서시딩기.app" \
            -ov -format UDZO \
            "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-mac.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-mac.dmg"

  build-windows:
    needs: bump-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        working-directory: src
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build .exe folder
        working-directory: src
        run: |
          python -m PyInstaller build.spec `
            --distpath ../ `
            --workpath build_tmp `
            --noconfirm

      - name: Zip output
        run: |
          Compress-Archive -Path "인플루언서시딩기" `
            -DestinationPath "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: "InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-windows.zip"

  release:
    needs: [bump-version, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.new_tag }}
          generate_release_notes: true
          files: |
            InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-mac.dmg
            InfluencerSeeder-${{ needs.bump-version.outputs.new_tag }}-windows.zip
